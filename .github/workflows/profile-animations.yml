name: Animaciones del perfil

on:
  schedule:
    - cron: "17 4 * * *" # cada día a las 05:17 (hora de Madrid en invierno)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contrib3d:
    name: Contribuciones en 3D
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Guardar cambios
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Actualizar contribuciones 3D"; then
            git pull --rebase
            git push
          fi

name: Animaciones del perfil

on:
  schedule:
    - cron: "17 4 * * *" # cada día a las 05:17 (hora de Madrid en invierno)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    name: Serpiente de contribuciones
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ed533e&color_dots=#1b1a20,#5c2a24,#8e3a2f,#c4473a,#ed533e
            dist/snake-light.svg?palette=github-light&color_snake=#ed533e&color_dots=#ebedf0,#ffd9d3,#f8a597,#f47a66,#ed533e

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Valentín Antonio De Gennaro · Desarrollador web full stack">
  <style>
    .f { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,25px) scale(1.15); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-70px,-20px) scale(0.95); } }
    @keyframes gridmove { from { transform: translateY(0); } to { transform: translateY(40px); } }
    @keyframes up { 0% { opacity: 0; transform: translateY(18px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes role { 0%, 2% { opacity: 0; transform: translateY(10px); } 6%, 30% { opacity: 1; transform: translateY(0); } 34%, 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes shine { from { transform: translateX(-400px); } to { transform: translateX(1400px); } }
    .b1 { animation: drift1 14s ease-in-out infinite; transform-origin: 300px 120px; }
    .b2 { animation: drift2 18s ease-in-out infinite; transform-origin: 950px 260px; }
    .grid { animation: gridmove 6s linear infinite; }
    .in1 { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .in2 { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) .5s forwards; }
    .in3 { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) .8s forwards; }
    .r { opacity: 0; animation: role 12s ease-in-out infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
    .pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .fl1 { animation: float 6s ease-in-out infinite; } .fl2 { animation: float 7s ease-in-out 1s infinite; } .fl3 { animation: float 8s ease-in-out 2s infinite; }
    .cur { animation: blink 1s step-end infinite; }
    .shine { animation: shine 7s ease-in-out 1.5s infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121116"/><stop offset="1" stop-color="#1b1a20"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#ed533e" stop-opacity=".55"/><stop offset="1" stop-color="#ed533e" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#347b65" stop-opacity=".45"/><stop offset="1" stop-color="#347b65" stop-opacity="0"/></radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffd9d3"/><stop offset="1" stop-color="#f47a66"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <g class="grid"><rect y="-40" width="1200" height="440" fill="url(#grid)"/></g>
    <circle class="b1" cx="300" cy="120" r="300" fill="url(#g1)"/>
    <circle class="b2" cx="950" cy="260" r="320" fill="url(#g2)"/>
    <rect class="shine" x="0" y="0" width="300" height="360" fill="url(#sh)" transform="skewX(-20)"/>

    <g class="in1">
      <rect x="70" y="62" width="250" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <circle class="pulse" cx="92" cy="78" r="5" fill="#3ddc97"/>
      <circle cx="92" cy="78" r="5" fill="#3ddc97"/>
      <text x="106" y="83" class="f" font-size="14" font-weight="600" fill="#e7e5ea">Disponible para prácticas FCT</text>
    </g>
    <g class="in2">
      <text x="68" y="168" class="f" font-size="58" font-weight="800" fill="url(#txt)" letter-spacing="-1.5">Valentín De Gennaro</text>
    </g>
    <g class="in3">
      <text x="70" y="214" class="m" font-size="22" fill="#ed533e">&gt;</text>
      <g class="m" font-size="22" fill="#e7e5ea">
        <text class="r" x="94" y="214">Desarrollador web full stack</text>
        <text class="r r2" x="94" y="214">Backend, APIs y automatización</text>
        <text class="r r3" x="94" y="214">Construyo productos que la gente usa</text>
      </g>
      <text x="70" y="270" class="f" font-size="16" fill="#a19dab">Estudiante de 2º de DAM · Valencia, España</text>
      <rect x="70" y="292" width="64" height="4" rx="2" fill="#ed533e"/>
    </g>

    <g class="fl1">
      <rect x="820" y="64" width="300" height="74" rx="14" fill="#1b1a20" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="840" y="94" class="m" font-size="13" fill="#a19dab">// proyecto en producción</text>
      <text x="840" y="120" class="m" font-size="15" fill="#e7e5ea">tinoprop<tspan fill="#ed533e">.</tspan>crm <tspan fill="#3ddc97">● live</tspan></text>
    </g>
    <g class="fl2">
      <rect x="900" y="160" width="230" height="74" rx="14" fill="#1b1a20" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="920" y="190" class="m" font-size="13" fill="#a19dab">auth.php</text>
      <text x="920" y="216" class="m" font-size="15" fill="#e7e5ea"><tspan fill="#f47a66">verify</tspan>(jwt) <tspan fill="#3ddc97">✓</tspan></text>
    </g>
    <g class="fl3">
      <rect x="800" y="256" width="250" height="60" rx="14" fill="#ed533e" fill-opacity=".14" stroke="#ed533e" stroke-opacity=".45"/>
      <text x="820" y="292" class="m" font-size="15" fill="#ffd9d3">$ git push origin main<tspan class="cur" fill="#ed533e">▌</tspan></text>
    </g>
  </g>
</svg>
